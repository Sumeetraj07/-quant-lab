name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Python: Lint + Type Check + Unit Tests
  # ---------------------------------------------------------------------------
  python-checks:
    name: Python — Lint, Type, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantlab
          POSTGRES_PASSWORD: quantlab_test
          POSTGRES_DB: quantlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check .

      - name: Mypy — type check
        run: mypy quant_engine/ backend/ --ignore-missing-imports

      - name: Pytest — unit tests
        env:
          DATABASE_SYNC_URL: postgresql+psycopg2://quantlab:quantlab_test@localhost:5432/quantlab_test
          DATABASE_URL: postgresql+asyncpg://quantlab:quantlab_test@localhost:5432/quantlab_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          SECRET_KEY: ci_test_secret_key_not_for_production
          ALPHA_VANTAGE_API_KEY: demo
        run: |
          pytest tests/ -m "not slow and not integration" --cov=quant_engine --cov=backend --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml

  # ---------------------------------------------------------------------------
  # Python: Integration Tests (requires services)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Python — Integration Tests
    runs-on: ubuntu-latest
    needs: python-checks

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantlab
          POSTGRES_PASSWORD: quantlab_test
          POSTGRES_DB: quantlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DB migrations
        env:
          DATABASE_SYNC_URL: postgresql+psycopg2://quantlab:quantlab_test@localhost:5432/quantlab_test
        run: alembic upgrade head

      - name: Pytest — integration tests
        env:
          DATABASE_SYNC_URL: postgresql+psycopg2://quantlab:quantlab_test@localhost:5432/quantlab_test
          DATABASE_URL: postgresql+asyncpg://quantlab:quantlab_test@localhost:5432/quantlab_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          SECRET_KEY: ci_test_secret_key_not_for_production
          ALPHA_VANTAGE_API_KEY: demo
        run: pytest tests/ -m "integration" -v

  # ---------------------------------------------------------------------------
  # Frontend: Type Check + Build
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: Validate docker-compose
  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker — Validate Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
